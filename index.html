<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E7C73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Forja Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first "body map" logbook. Light layered cards with soft depth, floating tab bar;
   a session opens full screen with a floating ring rest timer. Teal = what you train, coral = fatigue. */
:root {
  --bg: #EEF2F1; --surface: #FFFFFF; --surface-2: #F2F6F5; --surface-3: #E3EAE8; --line: #DCE4E2;
  --ink: #10201E; --ink-2: #4B5B58; --ink-3: #5D6A66;
  --accent: #0E7C73; --accent-fg: #0B6E66; --accent-ink: #FFFFFF; --accent-soft: #DDEFEC;
  --on-accent-2: rgba(255,255,255,.85); --on-accent-line: rgba(255,255,255,.18);
  --good: #0E7C73; --good-ink: #FFFFFF; --good-soft: #DDEFEC;
  --warn: #9A4A1E; --warn-soft: #FDEBE2;
  --bad: #B23A22; --bad-ink: #FFFFFF; --bad-soft: #FBE0D6;
  --pr: #B23A22; --pr-soft: #FDEBE2;
  --grid: #E3EAE8; --axis: #C3CFCC; --track: #C9D5D2; --knob: #FFFFFF;
  --heat-0: #E3EAE8; --heat-1: #BFE3DE; --heat-2: #7CC3BB; --heat-3: #2F9D93; --heat-4: #0B6E66;
  --m-today: #0E7C73; --m-sec: #7CC3BB; --m-tired: #F2A27E; --m-fatigued: #E26A45; --m-idle: #DCE4E2; --m-hatch: #66736F;
  --ring-1: #0E7C73; --ring-2: #E26A45; --ring-3: #2F5D8C;
  --scrim: rgba(16,32,30,.42);
  --shadow: 0 1px 2px rgba(16,32,30,.06), 0 10px 28px rgba(16,32,30,.10);
  --shadow-sm: 0 1px 2px rgba(16,32,30,.06), 0 6px 18px rgba(16,32,30,.07);
  --f-display: "Sora", "Hanken Grotesk", system-ui, sans-serif;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1413; --surface: #141E1C; --surface-2: #1B2725; --surface-3: #24322F; --line: #2A3835;
    --ink: #E8EFED; --ink-2: #B0BDBA; --ink-3: #8C9A97;
    --accent: #13877D; --accent-fg: #5CC8BC; --accent-ink: #FFFFFF; --accent-soft: #163734;
    --on-accent-2: rgba(255,255,255,.86); --on-accent-line: rgba(255,255,255,.18);
    --good: #4CC3B6; --good-ink: #08201D; --good-soft: #163734;
    --warn: #F2A27E; --warn-soft: #3A2419;
    --bad: #F0826A; --bad-ink: #2A0D07; --bad-soft: #3B1C15;
    --pr: #F2A27E; --pr-soft: #3A2419;
    --grid: #22302D; --axis: #3A4A47; --track: #3A4A47; --knob: #E8EFED;
    --heat-0: #1E2B29; --heat-1: #164A45; --heat-2: #1F6F67; --heat-3: #2F9D93; --heat-4: #7CC3BB;
    --m-today: #2FB0A3; --m-sec: #1F6F67; --m-tired: #A8644A; --m-fatigued: #E26A45; --m-idle: #2A3835; --m-hatch: #9AA8A5;
    --ring-1: #3FB8AC; --ring-2: #F08A63; --ring-3: #6E9BD0;
    --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.45);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0C1413; --surface: #141E1C; --surface-2: #1B2725; --surface-3: #24322F; --line: #2A3835;
    --ink: #E8EFED; --ink-2: #B0BDBA; --ink-3: #8C9A97;
    --accent: #13877D; --accent-fg: #5CC8BC; --accent-ink: #FFFFFF; --accent-soft: #163734;
    --on-accent-2: rgba(255,255,255,.86); --on-accent-line: rgba(255,255,255,.18);
    --good: #4CC3B6; --good-ink: #08201D; --good-soft: #163734;
    --warn: #F2A27E; --warn-soft: #3A2419;
    --bad: #F0826A; --bad-ink: #2A0D07; --bad-soft: #3B1C15;
    --pr: #F2A27E; --pr-soft: #3A2419;
    --grid: #22302D; --axis: #3A4A47; --track: #3A4A47; --knob: #E8EFED;
    --heat-0: #1E2B29; --heat-1: #164A45; --heat-2: #1F6F67; --heat-3: #2F9D93; --heat-4: #7CC3BB;
    --m-today: #2FB0A3; --m-sec: #1F6F67; --m-tired: #A8644A; --m-fatigued: #E26A45; --m-idle: #2A3835; --m-hatch: #9AA8A5;
    --ring-1: #3FB8AC; --ring-2: #F08A63; --ring-3: #6E9BD0;
    --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.45);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 35; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.display { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .015em; line-height: .92; }
.h1 { font-size: 40px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sm { font-size: 13px; }
.lead { color: var(--ink-2); font-size: 15px; max-width: 62ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.fill { fill: currentColor; stroke: none; }
.ic.bold { stroke-width: 3; }

/* boot */
.boot { min-height: 60vh; display: grid; place-items: center; color: var(--ink-3); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.boot-in { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.boot svg { width: 48px; height: 48px; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 560px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 25px; letter-spacing: .08em; line-height: 1; }
.logo { width: 28px; height: 28px; }
.sync { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); background: var(--surface-2); border: 0; padding: 6px 11px; border-radius: 99px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.sync.saving .dot { background: var(--warn); }
.sync.error .dot { background: var(--bad); }
.sync.local .dot { background: var(--ink-3); }
main.view { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px 150px; display: flex; flex-direction: column; gap: 30px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.tab[aria-current="page"] { color: var(--accent-fg); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent-fg); }
.minibar { position: fixed; left: 0; right: 0; z-index: 31; bottom: calc(57px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 8px; pointer-events: none; }
.minibar-in { pointer-events: auto; max-width: 560px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); text-align: left; font-weight: 600; }
.minibar-in .mb-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar-in .mb-go { display: flex; align-items: center; gap: 4px; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-ink); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .35; } }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-fg); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; gap: 6px; }
.btn.dashed { border-style: dashed; background: transparent; color: var(--ink-2); min-height: 52px; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.sm { width: 32px; height: 32px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; min-height: 36px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; width: 100%; min-width: 0; }
textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
select.input { padding-right: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.toggle { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 99px; background: var(--track); position: relative; border: 0; flex: none; margin: 0; cursor: pointer; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.toggle:checked { background: var(--accent); }
.toggle:checked::after { transform: translateX(20px); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stepper button { width: 36px; height: 38px; border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); }
.stepper span { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* sections & cards */
.section { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title { font-family: var(--f-display); font-weight: 800; font-size: 25px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 22px 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty b { color: var(--ink); font-size: 16px; }
.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--pr-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.banner .ic { color: var(--pr); margin-top: 1px; }
.banner.info { background: var(--accent-soft); }
.banner.info .ic { color: var(--accent-fg); }
.banner .btn { margin-top: 8px; }

/* home */
.wk-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wk-sub { color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.wk-sub .ic { width: 17px; height: 17px; color: var(--pr); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day .d { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.day.done .d { background: var(--accent); color: var(--accent-ink); }
.day.today .d { box-shadow: inset 0 0 0 2px var(--accent-fg); }
.day.done.today .d { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-fg); }
.next { position: relative; overflow: hidden; isolation: isolate; background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.plate-deco { position: absolute; right: -86px; top: -42px; width: 250px; height: 250px; z-index: -1; pointer-events: none; }
.plate-deco text { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .1em; fill: var(--on-accent-line); }
.next .eyebrow { color: var(--on-accent-2); }
.next h2 { font-size: 46px; margin-top: 4px; }
.next-sub { color: var(--on-accent-2); font-size: 14px; font-weight: 500; }
.next ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.next li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--on-accent-line); font-size: 14.5px; }
.next li .nm { min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.next li .nm .ic { width: 15px; height: 15px; opacity: .8; }
.next li .meta { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--on-accent-2); }
.next-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.next .btn.light { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); flex: 1; }
.next .btn.light:hover { filter: brightness(.96); }
.next .btn.outline-light { background: transparent; color: var(--accent-ink); border-color: var(--on-accent-2); }
.next .btn.outline-light:hover { background: var(--on-accent-line); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qbtn { display: flex; align-items: flex-start; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 12px; min-width: 0; }
.qbtn:hover { border-color: var(--accent-fg); }
.qbtn .ic { color: var(--accent-fg); margin-top: 1px; }
.qbtn b { display: block; font-size: 15px; }
.qbtn small { display: block; color: var(--ink-3); font-size: 12.5px; line-height: 1.3; }
.rec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 500px) { .rec-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px 9px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rec .top-r { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.rec .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rec .pc { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 99px; background: var(--good-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--good); }
.rec.mid .meter { background: var(--warn-soft); } .rec.mid .meter > i { background: var(--warn); }
.rec.low .meter { background: var(--bad-soft); } .rec.low .meter > i { background: var(--bad); }
.rec .st { font-size: 11.5px; color: var(--ink-3); font-weight: 600; display: flex; justify-content: space-between; gap: 4px; }
.rec .st .pc { font-size: 11.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.good { background: var(--good); } .sw.mid { background: var(--warn); } .sw.low { background: var(--bad); }
.sw.line { width: 16px; height: 2px; border-radius: 2px; background: var(--accent-fg); }
.sw.dotk { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sw.band { width: 16px; height: 10px; background: var(--accent-soft); border-radius: 2px; }
.prlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pritem { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.pritem:first-child { border-top: 0; }
.pritem .ic { color: var(--pr); }
.pritem .t { font-weight: 600; }
.pritem .s { font-size: 13px; color: var(--ink-3); }
.pr-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--pr-soft); color: var(--pr); font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.pr-badge .ic { width: 14px; height: 14px; }
.coach-card { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; }

.exb { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 4px; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
